name: SafeOps Real-Time CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        
      - name: Notify SafeOps (Pipeline Started)
        # We send a standard Webhook notification that pipeline started
        run: |
          if [ ! -z "${{ secrets.SAFEOPS_URL }}" ]; then
            curl -X POST ${{ secrets.SAFEOPS_URL }}/api/webhook/ \
                 -H "Content-Type: application/json" \
                 -d '{"repository": "${{ github.repository }}", "workflow": "${{ github.workflow }}", "status": "started", "workflow_id": "${{ github.run_id }}"}' || true
          fi

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: pip install requests
          
      - name: Run Build and Forward Logs to SafeOps
        env:
          SAFEOPS_URL: ${{ secrets.SAFEOPS_URL }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        # The crucial part: We pipe our normal commands into log_forwarder.py!
        # If log_forwarder.py detects a 'Block' response from SafeOps, it exits with code 1, which fails the GitHub Action!
        run: |
          {
            echo "Starting build process..."
            sleep 1
            echo "Installing dependencies..."
            sleep 1
            echo "Running migrations..."
            sleep 1
            
            echo "Running Static Code Security Scan (SAST)..."
            # REAL DATA: Scan the actual project files for any hardcoded API keys or Secrets
            grep -rnIE 'API_KEY\s*=\s*|password\s*=\s*|secret\s*=\s*' . || true
            echo "Running Unit Tests..."
            echo "All tests passed successfully!"
          } 2>&1 | python log_forwarder.py

      - name: Notify SafeOps (Pipeline Completed)
        if: always()
        run: |
          if [ ! -z "${{ secrets.SAFEOPS_URL }}" ]; then
            curl -X POST ${{ secrets.SAFEOPS_URL }}/api/webhook/ \
                 -H "Content-Type: application/json" \
                 -d '{"repository": "${{ github.repository }}", "workflow": "${{ github.workflow }}", "status": "completed", "workflow_id": "${{ github.run_id }}"}' || true
          fi
